<!doctype html>
<meta charset="utf-8">
<title>bench trace</title>
<style>
:root{--bg:#0f1115;--pan:#171a21;--ln:#262b36;--fg:#d6dae3;--dim:#7d879c;
      --acc:#6ea8fe;--hot:#f0883e;--ok:#57ab5a;--call:#c297ff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
     display:flex;flex-direction:column;
     font:12px ui-monospace,SFMono-Regular,Consolas,monospace}

#bar{display:flex;align-items:center;gap:10px;padding:7px 12px;
     background:var(--pan);border-bottom:1px solid var(--ln);flex:0 0 auto}
#slider{flex:1;accent-color:var(--acc);min-width:120px}
#ibox{background:#0d0f13;border:1px solid var(--ln);color:var(--fg);
      padding:3px 6px;border-radius:3px;font:inherit;width:120px}
.k{color:var(--dim);font-size:11px}

/* Flow is narrow (it is just timestamp + address + mnemonic), assembly gets
   the room it needs, and the screen column is sized so a 320x200 framebuffer
   renders at 4:3 rather than stretched to the monitor's aspect. */
#main{flex:1;min-height:0;display:grid;
      grid-template-columns:330px minmax(420px,1fr) 440px}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;
      border-right:1px solid var(--ln);overflow:hidden}
.pane:last-child{border-right:none}
.hd{padding:5px 10px;border-bottom:1px solid var(--ln);color:var(--dim);
    font-size:11px;background:var(--pan);flex:0 0 auto;
    display:flex;justify-content:space-between;gap:8px}
.bd{overflow-y:auto;overflow-x:hidden;flex:1;min-height:0}

/* ---- chart: execution flow, one row per block entered ---- */
.fr{display:block;padding:1px 6px;cursor:pointer;white-space:pre;
    border-left:2px solid transparent;font-size:11.5px}
.fr:hover{background:#1a1f29}
.fr.cur{background:#243044;border-left-color:var(--acc)}
.fr .t{display:inline-block;width:70px;color:#4a5266;text-align:right}
.fr .a{display:inline-block;width:50px;color:var(--fg);text-align:right}
.fr .m{color:var(--dim)}
.fr.cur .a,.fr.cur .m{color:var(--acc)}
.fr.call .m{color:var(--call)}
.fnh{padding:3px 10px;color:var(--hot);font-size:11px;background:#1b1f28;
     border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}

/* Register panel: fixed grid so values do not shift as they change, and a
   highlight on whatever changed since the previous instruction -- which is
   the whole point of having per-instruction state. */
#regs{padding:5px 8px;display:grid;font-size:11.5px;line-height:17px;
      grid-template-columns:repeat(4,1fr);gap:0 10px}
#regs div{white-space:pre}
#regs .rn{color:#5a6272}
#regs .rv{color:var(--fg)}
#regs .chg .rv{color:var(--hot);font-weight:600}
#regs .fl{grid-column:1/-1;color:var(--dim)}
#regs .fl b{color:var(--ok)}

/* ---- assembly ---- */
/* Rows are inline, not flex: browsers put a newline between flex items when
   copying, so a flex row pastes as one line per column. Fixed-width inline
   blocks keep the columns aligned and copy as a single line. */
.ins{display:block;padding:0 8px;white-space:pre;line-height:16px}
.ins:hover{background:#1a1f29}
.ins.cur{background:#243044;box-shadow:inset 2px 0 0 var(--acc)}
.ins .a{display:inline-block;width:46px;color:#5a6272}
.ins .b{display:inline-block;width:96px;color:#454d5e}
.ins.cur .t{color:var(--acc)}
.bsep{height:7px;border-top:1px dashed #2a3140;margin:3px 0}

/* Loop nesting rails: one per enclosing loop, drawn between the bytes column
   and the mnemonic. The head and tail rows cap the rail so the extent of the
   loop body is visible at a glance. */
.pad,.rail{user-select:none}
.pad{display:inline-block;width:9px}
/* Rails span the full line height via a tall inline-block with no content,
   so they draw continuously down a loop body. */
.rail{display:inline-block;width:11px;height:16px;vertical-align:top;
      border-left:1px solid #3a4a5e;margin-right:2px}
.ins.lhead .rail{border-top:1px solid #4a6b8a;
                 border-top-left-radius:3px}
.ins.ltail .rail{border-bottom:1px solid #4a6b8a;
                 border-bottom-left-radius:3px}
.ins.lhead .t{color:#8fb8dd}
.ins.lhead .a,.ins.ltail .a{color:#6d7a8d}

/* ---- screen + memory ---- */
/* A CGA frame is 320x200 or 640x200 in memory but was displayed at 4:3, so
   the pixels are non-square. Forcing a 4:3 box and letting the image fill it
   restores the shape the hardware actually produced -- 200 lines stretched to
   240-equivalent, not squashed to the monitor's 16:9. */
#shot{background:#000;flex:0 0 auto;padding:10px;
      display:flex;align-items:flex-start;justify-content:center}
#screen{image-rendering:pixelated;display:block;
        width:100%;aspect-ratio:4/3;object-fit:fill}
</style>

<div id="bar">
  <span class="k">instr</span>
  <input id="ibox">
  <input type="range" id="slider" min="0" value="0">
  <span class="k" id="pos"></span>
  <span class="sep"></span>
  <button id="bPrevFn" title="previous function (shift+F)">&#9664; fn</button>
  <button id="bNextFn" title="next function (F)">fn &#9654;</button>
  <button id="bOver" title="step over the call at the cursor (O)">over</button>
  <button id="bOut" title="run until this routine returns (U)">out &#8593;</button>
</div>

<div id="main">
  <div class="pane">
    <div class="hd">
      <span>execution</span>
      <span>
        <span class="tab on" id="tabStep">step</span>
        <span class="tab" id="tabBlk">blocks</span>
      </span>
    </div>
    <div class="bd" id="flow"></div>
    <div class="hd"><span>registers</span><span class="k" id="regmeta"></span></div>
    <div id="regs"></div>
  </div>
  <div class="pane">
    <div class="hd"><span id="asmttl">assembly</span><span class="k" id="asmmeta"></span></div>
    <div class="bd" id="asm"></div>
  </div>
  <div class="pane">
    <div class="hd"><span>screen</span><span class="k" id="sdesc"></span></div>
    <div id="shot"><img id="screen"></div>
  </div>
</div>

<script>
let META=null, INSTR=0, CURFN=null, ASMFN=null, lockScroll=false;

const hx=(n,w=5)=>(n>>>0).toString(16).toUpperCase().padStart(w,'0');
const fmt=n=>n.toLocaleString();
const $=i=>document.getElementById(i);

async function boot(){
  META=await (await fetch('/api/meta')).json();
  $('slider').max=META.max_instr;
  setInstr(Math.floor(META.max_instr*0.6));
}

/* ---- time is the only state ---- */
let t1=null,t2=null;
function setInstr(i){
  INSTR=Math.max(0,Math.min(META.max_instr,Math.round(i)));
  $('slider').value=INSTR;
  $('ibox').value=INSTR;
  $('pos').textContent=`of ${fmt(META.max_instr)}`;
  clearTimeout(t1); clearTimeout(t2);
  t1=setTimeout(loadFlow,50);
  t2=setTimeout(loadScreen,70);
}
const step=d=>setInstr(INSTR+d);

/* ---- step view: one row per instruction, with register state ----
   Nothing is emulated. The trace holds the register file at every traced
   instruction, so stepping is an array index and stepping backwards is free. */
let STEP=true, PREVREGS=null;

async function loadStep(){
  const at=INSTR;
  const r=await (await fetch(`/api/step?instr=${at}&before=30&after=120`)).json();
  if(at!==INSTR) return;
  const el=$('flow'); el.innerHTML='';
  let cur=null;
  for(const row of r.rows){
    const d=document.createElement('div');
    d.className='fr'+(row.instr===at?' cur':'');
    d.dataset.instr=row.instr;
    if(row.instr===at) cur=row;
    const bios = row.regs===undefined;
    d.innerHTML=`<span class="t">${fmt(row.instr)}  </span>`
      +`<span class="a">${hx(row.addr)}  </span>`
      +`<span class="m"${bios?' style="opacity:.45"':''}>${row.text}</span>`;
    d.onclick=()=>setInstr(row.instr);
    el.appendChild(d);
  }
  const c=el.querySelector('.cur');
  if(c) c.scrollIntoView({block:'center'});
  // Registers for the current instruction, with changes since the previous
  // one highlighted.
  const prev=r.rows.find(x=>x.instr===at-1);
  showRegs(cur, prev);
  if(cur) loadAsm(cur.addr);
}

function showRegs(cur, prev){
  const el=$('regs');
  if(!cur||!cur.regs){
    el.innerHTML='<div class="fl">no register state (BIOS or handler)</div>';
    $('regmeta').textContent='';
    return;
  }
  const R=cur.regs, P=prev&&prev.regs?prev.regs:null;
  const order=['ax','bx','cx','dx','si','di','bp','sp',
               'ds','es','ss','cs'];
  let h='';
  for(const n of order){
    const chg=P&&P[n]!==R[n];
    h+=`<div class="${chg?'chg':''}"><span class="rn">${n.toUpperCase()}</span>`
      +` <span class="rv">${hx(R[n],4)}</span></div>`;
  }
  // Flags word, decoded. Bit positions per the 8088 FLAGS register.
  const f=R.flags;
  const bits=[['OF',11],['DF',10],['IF',9],['TF',8],
              ['SF',7],['ZF',6],['AF',4],['PF',2],['CF',0]];
  h+='<div class="fl">'+bits.map(([n,b])=>
      (f>>b)&1 ? '<b>'+n+'</b>' : '<span style="opacity:.35">'+n+'</span>'
     ).join(' ')+'</div>';
  el.innerHTML=h;
  $('regmeta').textContent='DS:'+hx(R.ds,4)+' -> '
    +hx(((R.ds*16)&0xFFFFF),5);
}

/* ---- block view: one row per block entered ---- */
async function loadFlow(){
  if(STEP) return loadStep();
  const at=INSTR;
  const r=await (await fetch(`/api/flow?instr=${at}&before=60&after=200`)).json();
  if(at!==INSTR) return;
  const el=$('flow');
  el.innerHTML='';
  let lastFn=null, curRow=null;
  for(const row of r.rows){
    // Function header whenever the routine changes, so the chart reads as
    // "we are in this function, and these blocks ran".
    if(row.fn!=null && row.fn!==lastFn){
      const h=document.createElement('div');
      h.className='fnh';
      h.textContent='fn '+hx(row.fn);
      el.appendChild(h);
      lastFn=row.fn;
    }
    const d=document.createElement('div');
    d.className='fr'+(row.kind==='call'?' call':'');
    d.dataset.instr=row.instr;
    d.dataset.addr=row.addr;
    d.innerHTML=`<span class="t">${fmt(row.instr)}  </span>`
      +`<span class="a">${hx(row.addr)}  </span>`
      +`<span class="m">${row.t}  <span class=k>${row.n} ins</span></span>`;
    d.onclick=()=>setInstr(row.instr);
    el.appendChild(d);
  }
  // Mark and scroll to the row covering the current instant.
  let best=null;
  for(const d of el.querySelectorAll('.fr'))
    if(+d.dataset.instr<=at) best=d;
  if(best){
    best.classList.add('cur');
    best.scrollIntoView({block:'center'});
    CURFN=null;
    // Load the assembly for whatever function we are in.
    loadAsm(+best.dataset.addr);
    $('fnnow').textContent=lastFn!=null?'':'';
  }
}

/* ---- assembly of the current function ---- */
async function loadAsm(addr){
  const r=await (await fetch('/api/asm?addr='+addr)).json();
  if(r.fn===ASMFN){ markAsm(addr); return; }
  ASMFN=r.fn;
  $('asmttl').textContent='fn '+hx(r.fn);
  $('asmmeta').textContent=`${r.nblocks} blocks · ${r.ins.filter(x=>!x.sep).length} ins`;
  const el=$('asm'); el.innerHTML='';
  for(const i of r.ins){
    if(i.sep){
      // Only where the listing actually jumps -- straight-line runs stay
      // unbroken.
      const s=document.createElement('div');
      s.className='bsep';
      s.textContent='';
      el.appendChild(s);
      continue;
    }
    const d=document.createElement('div');
    d.className='ins'+(i.head?' lhead':'')+(i.tail?' ltail':'');
    d.dataset.a=i.addr;
    // Loop nesting: one rail per enclosing loop, so a loop body reads as a
    // block of code rather than a flat run with a divider at the top.
    // A fixed base indent so top-level code is not flush against the bytes
    // column, then one rail per enclosing loop.
    //
    // The rails are decoration; aria-hidden keeps them out of the clipboard
    // so a copied listing pastes as "addr bytes text" per line rather than
    // gaining blank lines. The tab characters are what actually separate the
    // columns when pasted -- CSS columns alone paste as nothing.
    let rails='<span class="pad" aria-hidden="true"></span>';
    for(let k=0;k<(i.depth||0);k++)
      rails+='<span class="rail" aria-hidden="true"></span>';
    // The separating spaces live inside the columns, so the CSS width
    // absorbs them on screen while the pasted text still has them.
    d.innerHTML=`<span class="a">${hx(i.addr)}  </span>`
      +`<span class="b">${i.bytes}  </span>`
      +rails
      +`<span class="t">${i.text}</span>`;
    d.onclick=()=>{};
    el.appendChild(d);
  }
  markAsm(addr);
}
function markAsm(addr){
  let hit=null;
  $('asm').querySelectorAll('.ins').forEach(d=>{
    const on=+d.dataset.a===addr;
    d.classList.toggle('cur',on);
    if(on) hit=d;
  });
  if(hit) hit.scrollIntoView({block:'center'});
}

/* ---- screen ---- */
async function loadScreen(){
  const at=INSTR;
  const r=await fetch('/api/screen?instr='+at);
  if(at!==INSTR) return;
  $('sdesc').textContent=r.headers.get('X-Screen-Desc')||'';
  $('screen').src=URL.createObjectURL(await r.blob());
}

/* ---- wiring: one control ---- */
$('slider').oninput=e=>setInstr(+e.target.value);
$('ibox').onchange=e=>setInstr(+e.target.value);
// Structural navigation. These are searches over the recorded timeline, so
// "step out" lands on the instruction the routine actually returned to rather
// than a prediction of where it should.
async function seek(what,dir){
  const r=await (await fetch(
    `/api/seek?what=${what}&instr=${INSTR}&dir=${dir||1}`)).json();
  if(r.instr!==INSTR) setInstr(r.instr);
}
$('bNextFn').onclick=()=>seek('fn',1);
$('bPrevFn').onclick=()=>seek('fn',-1);
$('bOver').onclick=()=>seek('over',1);
$('bOut').onclick=()=>seek('out',1);

$('tabStep').onclick=()=>{STEP=true;
  $('tabStep').classList.add('on'); $('tabBlk').classList.remove('on');
  loadFlow();};
$('tabBlk').onclick=()=>{STEP=false;
  $('tabBlk').classList.add('on'); $('tabStep').classList.remove('on');
  loadFlow();};

// Scrolling the chart moves time: the rows ARE the timeline.
$('flow').onwheel=e=>{
  e.preventDefault();
  step(e.deltaY>0 ? (e.shiftKey?2000:200) : (e.shiftKey?-2000:-200));
};

// Arrows step ONE instruction -- that is the useful motion now that register
// state is per-instruction. Shift for 100, PgUp/PgDn for a broad sweep.
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'){e.preventDefault();step(e.shiftKey?100:1);}
  if(e.key==='ArrowLeft'){e.preventDefault();step(e.shiftKey?-100:-1);}
  if(e.key==='ArrowDown'){e.preventDefault();step(1);}
  if(e.key==='ArrowUp'){e.preventDefault();step(-1);}
  if(e.key==='.')step(1);
  if(e.key===',')step(-1);
  if(e.key==='PageDown'){e.preventDefault();step(10000);}
  if(e.key==='PageUp'){e.preventDefault();step(-10000);}
  // Structural navigation
  if(e.key==='f'||e.key==='F'){e.preventDefault();seek('fn',e.shiftKey?-1:1);}
  if(e.key==='o'||e.key==='O'){e.preventDefault();seek('over',1);}
  if(e.key==='u'||e.key==='U'){e.preventDefault();seek('out',1);}
});
boot();
</script>
